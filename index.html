<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samuray43k | 天使様</title>
    <meta name="description" content="Mahiru Shiina Fan Page - Samuray43k">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Quicksand:wght@300;400;500;700&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0D0B14;
            --surface: rgba(26, 24, 37, 0.6);
            --accent-primary: #F5EAC4; /* Mahiru Hair */
            --accent-secondary: #B5744C; /* Caramel Eyes */
            --glow: rgba(245, 234, 196, 0.15);
            --angel-blue: #A2C2E1;
            --text-main: #E8E4DD;
            
            --font-display: 'Cormorant Garamond', serif;
            --font-body: 'Quicksand', sans-serif;
            --font-jp: 'Zen Maru Gothic', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Video Background */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -3;
            opacity: 0.3;
            filter: contrast(1.2) saturate(1.1);
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(13, 11, 20, 0.5) 0%, rgba(13, 11, 20, 0.95) 100%);
            z-index: -2;
        }

        .grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: -1;
        }

        /* Aurora Glow */
        .aurora-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vh;
            background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
            opacity: 0.5;
            z-index: -2;
            animation: pulseGlow 8s ease-in-out infinite alternate;
            pointer-events: none;
        }

        /* Particles Container */
        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: var(--accent-primary);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); /* Diamond shape */
            opacity: 0;
            animation: floatUp linear infinite;
        }

        /* Main Layout */
        main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 90%;
            max-width: 1400px;
            min-height: 80vh;
            gap: 4rem;
            z-index: 10;
            position: relative;
            align-items: center;
        }

        /* Left Content */
        .content-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            padding: 2rem;
        }

        .glass-card {
            background: var(--surface);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(245, 234, 196, 0.15);
            border-radius: 24px;
            padding: 3.5rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: fadeIn 1s ease-out 0.2s forwards;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .glass-card:hover {
            box-shadow: 0 12px 40px 0 rgba(245, 234, 196, 0.05);
            border-color: rgba(245, 234, 196, 0.25);
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
            opacity: 0.4;
        }

        .jp-header {
            font-family: var(--font-jp);
            color: var(--accent-primary);
            font-size: 1rem;
            letter-spacing: 0.3em;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            opacity: 0.9;
            text-transform: uppercase;
        }

        .jp-header::after {
            content: '';
            height: 1px;
            width: 40px;
            background: var(--accent-primary);
            opacity: 0.6;
        }

        h1 {
            font-family: var(--font-display);
            font-size: clamp(3.5rem, 6vw, 5.5rem);
            font-weight: 700;
            color: var(--accent-primary);
            line-height: 1;
            margin-bottom: 2rem;
            text-shadow: 0 0 30px rgba(245, 234, 196, 0.15);
            white-space: nowrap;
            position: relative;
            z-index: 2;
        }

        .char {
            display: inline-block;
            opacity: 0;
            transform: translateY(30px);
            animation: textReveal 0.8s cubic-bezier(0.2, 1, 0.3, 1) forwards;
        }

        .quote-container {
            margin-bottom: 3rem;
            border-left: 3px solid var(--accent-secondary);
            padding-left: 1.5rem;
            opacity: 0;
            animation: fadeIn 1s ease-out 0.8s forwards;
        }

        .quote-de {
            font-family: var(--font-display);
            font-style: italic;
            font-size: 1.3rem;
            color: var(--text-main);
            margin-bottom: 0.8rem;
            line-height: 1.4;
        }

        .quote-jp {
            font-family: var(--font-jp);
            font-size: 0.9rem;
            color: var(--angel-blue);
            opacity: 0.8;
            letter-spacing: 0.05em;
        }

        .links {
            display: flex;
            gap: 1.5rem;
            opacity: 0;
            animation: fadeIn 1s ease-out 1s forwards;
        }

        .btn {
            text-decoration: none;
            color: var(--text-main);
            font-family: var(--font-body);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 0.15em;
            padding: 1rem 2rem;
            border: 1px solid rgba(181, 116, 76, 0.5);
            border-radius: 50px;
            transition: all 0.4s cubic-bezier(0.2, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            background: rgba(181, 116, 76, 0.05);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--accent-secondary);
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.4s cubic-bezier(0.2, 1, 0.3, 1);
            z-index: -1;
        }

        .btn:hover {
            color: #fff;
            border-color: var(--accent-secondary);
            box-shadow: 0 10px 30px -10px var(--accent-secondary);
        }

        .btn:hover::before {
            transform: scaleX(1);
            transform-origin: left;
        }

        /* Right Side - Avatar */
        .visual-side {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            perspective: 1500px;
            height: 100%;
        }

        .avatar-container {
            width: 420px;
            height: 580px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            z-index: 5;
        }

        .avatar-frame {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            /* Asymmetric clip path */
            clip-path: polygon(15% 0, 100% 0, 100% 85%, 85% 100%, 0 100%, 0 15%);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            opacity: 0;
            animation: revealImage 1.4s cubic-bezier(0.2, 1, 0.3, 1) 0.4s forwards;
            background: #000;
        }
        
        .avatar-frame::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 60%, rgba(181, 116, 76, 0.2));
            pointer-events: none;
            z-index: 2;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.2, 1, 0.3, 1), filter 0.5s ease;
            filter: saturate(0.9) contrast(1.1);
        }

        .avatar-container:hover .avatar-img {
            transform: scale(1.08);
            filter: saturate(1.1) contrast(1.15);
        }

        /* Decorative Elements */
        .deco-jp {
            position: absolute;
            top: -10%;
            right: -15%;
            font-family: var(--font-jp);
            font-size: 30rem;
            font-weight: 900;
            color: rgba(245, 234, 196, 0.03);
            z-index: -1;
            pointer-events: none;
            writing-mode: vertical-rl;
            animation: floatText 8s ease-in-out infinite alternate;
            user-select: none;
        }

        .meta-info {
            position: absolute;
            bottom: 0;
            right: 0;
            text-align: right;
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            color: rgba(232, 228, 221, 0.4);
            font-family: var(--font-body);
            z-index: 10;
            opacity: 0;
            animation: fadeIn 1s ease 1.5s forwards;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes textReveal {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes revealImage {
            from { clip-path: inset(100% 0 0 0); opacity: 0; transform: scale(0.95); }
            to { clip-path: polygon(15% 0, 100% 0, 100% 85%, 85% 100%, 0 100%, 0 15%); opacity: 1; transform: scale(1); }
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            20% { opacity: 0.4; }
            80% { opacity: 0.4; }
            100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
        }

        @keyframes pulseGlow {
            from { opacity: 0.3; transform: translate(-50%, -50%) scale(0.95); }
            to { opacity: 0.6; transform: translate(-50%, -50%) scale(1.05); }
        }

        @keyframes floatText {
            from { transform: translateY(0); }
            to { transform: translateY(-30px); }
        }

        /* Responsive */
        @media (max-width: 1200px) {
            main {
                width: 95%;
                gap: 2rem;
            }
            
            h1 {
                font-size: 4rem;
            }
            
            .avatar-container {
                width: 350px;
                height: 480px;
            }
            
            .deco-jp {
                font-size: 20rem;
                right: -5%;
            }
        }

        @media (max-width: 900px) {
            body {
                height: auto;
                overflow-y: auto;
                padding: 2rem 0;
                display: block;
            }

            main {
                grid-template-columns: 1fr;
                height: auto;
                max-width: 500px;
                margin: 0 auto;
                padding: 0 1rem;
                gap: 1.5rem;
            }

            .content-side {
                order: 2;
                padding: 0;
            }
            
            .glass-card {
                padding: 2rem 1.5rem;
                text-align: center;
            }
            
            h1 {
                font-size: clamp(2.2rem, 10vw, 3.5rem);
                word-break: break-word;
                white-space: normal;
            }
            
            .jp-header {
                justify-content: center;
                font-size: 0.85rem;
            }
            
            .quote-container {
                border-left: none;
                border-top: 2px solid var(--accent-secondary);
                padding-left: 0;
                padding-top: 1rem;
                margin-top: 0.5rem;
                margin-bottom: 2rem;
            }
            
            .quote-de {
                font-size: 1.05rem;
            }
            
            .quote-jp {
                font-size: 0.8rem;
            }

            .links {
                justify-content: center;
            }

            .visual-side {
                order: 1;
                height: auto;
                margin-bottom: 0;
            }

            .avatar-container {
                width: 100%;
                max-width: 200px;
                height: 260px;
                margin: 0 auto;
            }

            .deco-jp {
                font-size: 10rem;
                top: 50%;
                right: 0;
                transform: translateY(-50%);
                writing-mode: horizontal-tb;
                width: 100%;
                text-align: center;
                z-index: -1;
            }
            
            .meta-info {
                position: relative;
                text-align: center;
                margin-top: 2rem;
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 1.5rem 0;
            }
            
            main {
                gap: 1rem;
            }
            
            h1 {
                font-size: clamp(1.8rem, 9vw, 2.8rem);
            }
            
            .glass-card {
                padding: 1.5rem 1.2rem;
            }

            .avatar-container {
                max-width: 200px;
                height: 260px;
            }

            .links {
                flex-direction: column;
                gap: 0.8rem;
                width: 100%;
            }

            .btn {
                width: 100%;
                padding: 0.8rem 1.5rem;
                font-size: 0.8rem;
            }
            
            .quote-de {
                font-size: 0.95rem;
            }
            
            .deco-jp {
                font-size: 7rem;
            }
        }
    </style>
</head>
<body>

    <video class="bg-video" autoplay muted loop playsinline>
        <source src="bg.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>
    <div class="grain"></div>
    <div class="aurora-glow"></div>
    <div class="particles-container" id="particles"></div>

    <main>
        <section class="content-side">
            <div class="glass-card">
                <div class="jp-header">天使様</div>
                <h1 id="main-title">Samuray43k</h1>
                
                <div class="quote-container">
                    <p class="quote-de">„Bitte... ich bin doch nicht allein? Du bist doch meine Rettung?"</p>
                    <p class="quote-jp">お願い...一人じゃないよね？あなたは私の救いだから</p>
                </div>

                <div class="links">
                    <a href="https://t.me/HolyZxc" target="_blank" class="btn">Telegram</a>
                    <a href="https://github.com/Samuray4ik04" target="_blank" class="btn">GitHub</a>
                </div>
            </div>
            
            <div class="meta-info">
                <p>MAHIRU SHIINA FAN PAGE</p>
                <p>EST. 2024</p>
            </div>
        </section>

        <section class="visual-side">
            <div class="deco-jp">天使</div>
            <div class="avatar-container" id="avatar-container">
                <div class="avatar-frame">
                    <img src="avatar.jpg" alt="Mahiru Shiina Avatar" class="avatar-img">
                </div>
            </div>
        </section>
    </main>

    <script>
        const title = document.getElementById('main-title');
        const text = title.textContent;
        title.textContent = '';
        
        [...text].forEach((char, index) => {
            const span = document.createElement('span');
            span.textContent = char;
            span.className = 'char';
            span.style.animationDelay = `${index * 0.08 + 0.3}s`;
            title.appendChild(span);
        });

        const particlesContainer = document.getElementById('particles');
        const particleCount = 25;

        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'particle';
            
            // Random properties
            const size = Math.random() * 6 + 3; // 3px to 9px
            const left = Math.random() * 100; // 0% to 100%
            const duration = Math.random() * 15 + 10; // 10s to 25s
            const delay = Math.random() * 20; // 0s to 20s
            
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${left}%`;
            particle.style.animationDuration = `${duration}s`;
            particle.style.animationDelay = `-${delay}s`; // Start immediately with offset
            
            particlesContainer.appendChild(particle);
        }

        for (let i = 0; i < particleCount; i++) {
            createParticle();
        }

        const container = document.getElementById('avatar-container');
        
        // Only enable on desktop to save battery/performance on mobile
        if (window.matchMedia("(min-width: 1024px)").matches) {
            document.addEventListener('mousemove', (e) => {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 30;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 30;
                
                // Apply rotation to container
                if(container) {
                    container.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
                }
            });
            
            // Reset on mouse leave
            document.addEventListener('mouseleave', () => {
                if(container) {
                    container.style.transform = `rotateY(0deg) rotateX(0deg)`;
                }
            });
        }
    </script>
</body>
</html>
