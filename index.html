<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samuray43k | Imperial Angel</title>
    <meta name="description" content="Samuray43k — Imperial Angel. Mahiru Shiina Fan Page.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Raleway:wght@300;400;500;600;700&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #08060E;
            --surface: rgba(18, 15, 28, 0.75);
            --gold: #C9A84C;
            --gold-light: #E8D48B;
            --gold-dim: rgba(201, 168, 76, 0.15);
            --imperial-red: #8B1A1A;
            --imperial-green: #2A4A3A;
            --cream: #F0E6D3;
            --text-main: #E0D8CA;
            --text-dim: rgba(224, 216, 202, 0.5);

            --font-display: 'Playfair Display', serif;
            --font-body: 'Raleway', sans-serif;
            --font-jp: 'Zen Maru Gothic', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            background: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* === VIDEO BG === */
        .bg-video {
            position: fixed; inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -5;
            opacity: 0.2;
            filter: saturate(0.4) brightness(0.6);
        }

        .bg-overlay {
            position: fixed; inset: 0;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(201, 168, 76, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(139, 26, 26, 0.05) 0%, transparent 50%),
                linear-gradient(180deg, rgba(8, 6, 14, 0.7) 0%, rgba(8, 6, 14, 0.95) 100%);
            z-index: -4;
        }

        /* === ORNAMENT SVG CORNERS === */
        .corner-ornament {
            position: fixed;
            width: 180px;
            height: 180px;
            z-index: 0;
            opacity: 0.12;
            pointer-events: none;
        }
        .corner-ornament svg { width: 100%; height: 100%; }
        .corner-tl { top: 20px; left: 20px; }
        .corner-tr { top: 20px; right: 20px; transform: scaleX(-1); }
        .corner-bl { bottom: 20px; left: 20px; transform: scaleY(-1); }
        .corner-br { bottom: 20px; right: 20px; transform: scale(-1, -1); }

        /* === GOLD PARTICLES === */
        .particles-container {
            position: fixed; inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: var(--gold);
            border-radius: 50%;
            opacity: 0;
            animation: floatUp linear infinite;
            box-shadow: 0 0 6px rgba(201, 168, 76, 0.4);
        }

        /* === MAIN LAYOUT === */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 700px;
            z-index: 10;
            position: relative;
            padding: 3rem 0;
        }

        /* === IMPERIAL CREST === */
        .crest {
            width: 60px;
            height: 60px;
            margin-bottom: 1.5rem;
            opacity: 0;
            animation: fadeDown 1s ease 0.2s forwards;
        }
        .crest svg {
            width: 100%; height: 100%;
            filter: drop-shadow(0 0 12px rgba(201, 168, 76, 0.3));
        }

        /* === AVATAR === */
        .avatar-wrapper {
            position: relative;
            margin-bottom: 2.5rem;
            opacity: 0;
            animation: scaleIn 1.2s cubic-bezier(0.2, 1, 0.3, 1) 0.3s forwards;
        }

        .avatar-border {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            padding: 4px;
            background: conic-gradient(
                from 0deg,
                var(--gold) 0%,
                var(--gold-light) 25%,
                var(--gold) 50%,
                var(--gold-light) 75%,
                var(--gold) 100%
            );
            animation: rotateBorder 12s linear infinite;
            position: relative;
        }

        .avatar-border::before {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 1px solid var(--gold-dim);
        }

        .avatar-border::after {
            content: '';
            position: absolute;
            inset: -16px;
            border-radius: 50%;
            border: 1px solid rgba(201, 168, 76, 0.06);
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            background: var(--bg-dark);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease, filter 0.4s ease;
            filter: saturate(0.9) contrast(1.05);
        }

        .avatar-wrapper:hover .avatar-img {
            transform: scale(1.1);
            filter: saturate(1.1) contrast(1.1);
        }

        .avatar-glow {
            position: absolute;
            inset: -40px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(201, 168, 76, 0.1) 0%, transparent 70%);
            z-index: -1;
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        /* === NAME === */
        .name-section {
            text-align: center;
            margin-bottom: 1rem;
        }

        .jp-title {
            font-family: var(--font-jp);
            color: var(--gold);
            font-size: 0.85rem;
            letter-spacing: 0.5em;
            margin-bottom: 0.8rem;
            opacity: 0;
            animation: fadeDown 0.8s ease 0.6s forwards;
        }

        h1 {
            font-family: var(--font-display);
            font-size: clamp(2.8rem, 7vw, 4.5rem);
            font-weight: 900;
            color: var(--cream);
            line-height: 1;
            letter-spacing: 0.04em;
            position: relative;
            display: inline-block;
        }

        .char {
            display: inline-block;
            opacity: 0;
            transform: translateY(40px) rotateX(-40deg);
            animation: charReveal 0.9s cubic-bezier(0.2, 1, 0.3, 1) forwards;
        }

        .title-ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
            opacity: 0;
            animation: fadeIn 1s ease 1.2s forwards;
        }

        .ornament-line {
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .ornament-diamond {
            width: 8px;
            height: 8px;
            background: var(--gold);
            transform: rotate(45deg);
            flex-shrink: 0;
        }

        /* === QUOTE === */
        .quote-section {
            text-align: center;
            margin: 2rem 0 2.5rem;
            max-width: 500px;
            opacity: 0;
            animation: fadeIn 1s ease 1s forwards;
        }

        .quote-text {
            font-family: var(--font-display);
            font-style: italic;
            font-size: 1.15rem;
            color: var(--text-main);
            line-height: 1.6;
            margin-bottom: 0.6rem;
        }

        .quote-text::before { content: '\201E'; color: var(--gold); font-size: 1.5rem; }
        .quote-text::after { content: '\201C'; color: var(--gold); font-size: 1.5rem; }

        .quote-jp {
            font-family: var(--font-jp);
            font-size: 0.8rem;
            color: var(--gold);
            opacity: 0.6;
            letter-spacing: 0.08em;
        }

        /* === LINKS === */
        .links {
            display: flex;
            gap: 1.2rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 2.5rem;
            opacity: 0;
            animation: fadeIn 1s ease 1.3s forwards;
        }

        .btn {
            text-decoration: none;
            color: var(--gold);
            font-family: var(--font-body);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            padding: 0.9rem 2.2rem;
            border: 1px solid rgba(201, 168, 76, 0.35);
            border-radius: 0;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            background: transparent;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--gold);
            transform: scaleY(0);
            transform-origin: bottom;
            transition: transform 0.4s cubic-bezier(0.2, 1, 0.3, 1);
            z-index: -1;
        }

        .btn:hover {
            color: var(--bg-dark);
            border-color: var(--gold);
            box-shadow: 0 0 30px rgba(201, 168, 76, 0.2);
        }

        .btn:hover::before {
            transform: scaleY(1);
        }

        /* === IMPERIAL BANNER === */
        .imperial-banner {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 1.2rem 2rem;
            background: linear-gradient(90deg, transparent, rgba(201, 168, 76, 0.05), transparent);
            border-top: 1px solid rgba(201, 168, 76, 0.1);
            border-bottom: 1px solid rgba(201, 168, 76, 0.1);
            margin-bottom: 2rem;
            opacity: 0;
            animation: fadeIn 1s ease 1.5s forwards;
        }

        .banner-icon {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
        }
        .banner-icon svg {
            width: 100%; height: 100%;
        }

        .banner-text {
            font-family: var(--font-display);
            font-size: 0.85rem;
            color: var(--text-dim);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .banner-text span {
            color: var(--gold);
            font-weight: 700;
        }

        /* === FOOTER === */
        .footer {
            text-align: center;
            opacity: 0;
            animation: fadeIn 1s ease 1.8s forwards;
        }

        .footer-text {
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        /* === DECORATIVE BG TEXT === */
        .bg-deco-text {
            position: fixed;
            font-family: var(--font-jp);
            font-size: 25rem;
            font-weight: 900;
            color: rgba(201, 168, 76, 0.02);
            z-index: -1;
            pointer-events: none;
            user-select: none;
            writing-mode: vertical-rl;
            top: 50%;
            right: -5%;
            transform: translateY(-50%);
            animation: floatText 10s ease-in-out infinite alternate;
        }

        /* === ANIMATIONS === */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes charReveal {
            to { opacity: 1; transform: translateY(0) rotateX(0deg); }
        }

        @keyframes rotateBorder {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulseGlow {
            from { opacity: 0.5; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1.05); }
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            15% { opacity: 0.6; }
            85% { opacity: 0.6; }
            100% { transform: translateY(-10vh) rotate(180deg); opacity: 0; }
        }

        @keyframes floatText {
            from { transform: translateY(-50%); }
            to { transform: translateY(calc(-50% - 30px)); }
        }

        /* === RESPONSIVE === */
        @media (max-width: 768px) {
            .corner-ornament { width: 100px; height: 100px; }

            .avatar-border { width: 180px; height: 180px; }

            h1 { font-size: clamp(2.2rem, 10vw, 3.2rem); }

            .quote-text { font-size: 1rem; }

            .imperial-banner {
                flex-direction: column;
                text-align: center;
                gap: 0.8rem;
                padding: 1rem;
            }

            .bg-deco-text { font-size: 15rem; right: -15%; }

            .links { flex-direction: column; width: 100%; max-width: 280px; }
            .btn { width: 100%; text-align: center; }
        }

        @media (max-width: 480px) {
            main { padding: 2rem 0; }
            .corner-ornament { width: 70px; height: 70px; opacity: 0.08; }
            .avatar-border { width: 150px; height: 150px; }
            .ornament-line { width: 50px; }
            .bg-deco-text { font-size: 10rem; }
            .crest { width: 45px; height: 45px; }
        }
    </style>
</head>
<body>

    <video class="bg-video" autoplay muted loop playsinline>
        <source src="bg.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>

    <!-- Corner Ornaments -->
    <div class="corner-ornament corner-tl">
        <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 10 L10 80 Q10 90 20 90 L50 90" stroke="#C9A84C" stroke-width="1" fill="none"/>
            <path d="M10 10 L80 10 Q90 10 90 20 L90 50" stroke="#C9A84C" stroke-width="1" fill="none"/>
            <circle cx="10" cy="10" r="3" fill="#C9A84C"/>
            <path d="M30 30 L30 60 Q30 65 35 65 L60 65" stroke="#C9A84C" stroke-width="0.5" fill="none" opacity="0.6"/>
            <path d="M30 30 L60 30 Q65 30 65 35 L65 60" stroke="#C9A84C" stroke-width="0.5" fill="none" opacity="0.6"/>
            <rect x="27" y="27" width="6" height="6" transform="rotate(45 30 30)" fill="none" stroke="#C9A84C" stroke-width="0.5" opacity="0.6"/>
            <path d="M15 45 Q20 42 25 45 Q30 48 35 45" stroke="#C9A84C" stroke-width="0.5" fill="none" opacity="0.4"/>
            <path d="M45 15 Q42 20 45 25 Q48 30 45 35" stroke="#C9A84C" stroke-width="0.5" fill="none" opacity="0.4"/>
        </svg>
    </div>
    <div class="corner-ornament corner-tr">
        <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 10 L10 80 Q10 90 20 90 L50 90" stroke="#C9A84C" stroke-width="1" fill="none"/>
            <path d="M10 10 L80 10 Q90 10 90 20 L90 50" stroke="#C9A84C" stroke-width="1" fill="none"/>
            <circle cx="10" cy="10" r="3" fill="#C9A84C"/>
            <path d="M30 30 L30 60 Q30 65 35 65 L60 65" stroke="#C9A84C" stroke-width="0.5" fill="none" opacity="0.6"/>
            <path d="M30 30 L60 30 Q65 30 65 35 L65 60" stroke="#C9A84C" stroke-width="0.5" fill="none" opacity="0.6"/>
            <rect x="27" y="27" width="6" height="6" transform="rotate(45 30 30)" fill="none" stroke="#C9A84C" stroke-width="0.5" opacity="0.6"/>
        </svg>
    </div>
    <div class="corner-ornament corner-bl">
        <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 10 L10 80 Q10 90 20 90 L50 90" stroke="#C9A84C" stroke-width="1" fill="none"/>
            <path d="M10 10 L80 10 Q90 10 90 20 L90 50" stroke="#C9A84C" stroke-width="1" fill="none"/>
            <circle cx="10" cy="10" r="3" fill="#C9A84C"/>
        </svg>
    </div>
    <div class="corner-ornament corner-br">
        <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 10 L10 80 Q10 90 20 90 L50 90" stroke="#C9A84C" stroke-width="1" fill="none"/>
            <path d="M10 10 L80 10 Q90 10 90 20 L90 50" stroke="#C9A84C" stroke-width="1" fill="none"/>
            <circle cx="10" cy="10" r="3" fill="#C9A84C"/>
        </svg>
    </div>

    <!-- Bg deco -->
    <div class="bg-deco-text">天使</div>

    <!-- Gold particles -->
    <div class="particles-container" id="particles"></div>

    <main>
        <!-- Imperial Crest -->
        <div class="crest">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Double-headed eagle simplified -->
                <path d="M50 8 L55 20 L68 14 L60 26 L72 28 L60 34 L66 46 L54 40 L50 52 L46 40 L34 46 L40 34 L28 28 L40 26 L32 14 L45 20 Z" fill="#C9A84C" opacity="0.9"/>
                <circle cx="50" cy="30" r="8" fill="none" stroke="#C9A84C" stroke-width="1"/>
                <circle cx="50" cy="30" r="4" fill="#C9A84C" opacity="0.5"/>
                <path d="M38 55 Q44 50 50 55 Q56 50 62 55" stroke="#C9A84C" stroke-width="1" fill="none"/>
                <path d="M35 62 Q42 56 50 62 Q58 56 65 62" stroke="#C9A84C" stroke-width="0.8" fill="none" opacity="0.7"/>
                <path d="M40 70 L50 65 L60 70" stroke="#C9A84C" stroke-width="0.8" fill="none" opacity="0.5"/>
                <line x1="50" y1="52" x2="50" y2="75" stroke="#C9A84C" stroke-width="0.5" opacity="0.4"/>
                <!-- Crown -->
                <path d="M42 8 L44 2 L46 6 L48 0 L50 6 L52 0 L54 6 L56 2 L58 8" stroke="#C9A84C" stroke-width="0.8" fill="none"/>
            </svg>
        </div>

        <!-- Avatar -->
        <div class="avatar-wrapper">
            <div class="avatar-glow"></div>
            <div class="avatar-border">
                <div class="avatar-inner">
                    <img src="avatar.jpg" alt="Mahiru Shiina" class="avatar-img">
                </div>
            </div>
        </div>

        <!-- Name -->
        <div class="name-section">
            <div class="jp-title">天使様 ・ IMPERIAL ANGEL</div>
            <h1 id="main-title">Samuray43k</h1>
            <div class="title-ornament">
                <div class="ornament-line"></div>
                <div class="ornament-diamond"></div>
                <div class="ornament-line"></div>
            </div>
        </div>

        <!-- Quote -->
        <div class="quote-section">
            <p class="quote-text">Bitte... ich bin doch nicht allein? Du bist doch meine Rettung?</p>
            <p class="quote-jp">お願い...一人じゃないよね？あなたは私の救いだから</p>
        </div>

        <!-- Links -->
        <div class="links">
            <a href="https://t.me/HolyZxc" target="_blank" class="btn">Telegram</a>
            <a href="https://github.com/Samuray4ik04" target="_blank" class="btn">GitHub</a>
        </div>

        <!-- Imperial Banner -->
        <div class="imperial-banner">
            <div class="banner-icon">
                <svg viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M25 5 L30 15 L25 12 L20 15 Z" fill="#C9A84C" opacity="0.8"/>
                    <path d="M25 12 L25 40" stroke="#C9A84C" stroke-width="1"/>
                    <path d="M18 20 Q25 16 32 20" stroke="#C9A84C" stroke-width="0.8" fill="none"/>
                    <circle cx="25" cy="42" r="4" fill="none" stroke="#C9A84C" stroke-width="0.8"/>
                    <circle cx="25" cy="42" r="1.5" fill="#C9A84C" opacity="0.5"/>
                </svg>
            </div>
            <div class="banner-text">
                <span>Mahiru Shiina</span> Fan Page &mdash; Est. 2024
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p class="footer-text">Ad Gloriam Aeternam</p>
        </div>
    </main>

    <script>
        // Animated title
        const title = document.getElementById('main-title');
        const text = title.textContent;
        title.textContent = '';

        [...text].forEach((char, i) => {
            const span = document.createElement('span');
            span.textContent = char;
            span.className = 'char';
            span.style.animationDelay = `${i * 0.07 + 0.7}s`;
            title.appendChild(span);
        });

        // Gold particles
        const pc = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 4 + 2;
            p.style.width = `${size}px`;
            p.style.height = `${size}px`;
            p.style.left = `${Math.random() * 100}%`;
            p.style.animationDuration = `${Math.random() * 18 + 12}s`;
            p.style.animationDelay = `-${Math.random() * 25}s`;
            pc.appendChild(p);
        }
    </script>
</body>
</html>
