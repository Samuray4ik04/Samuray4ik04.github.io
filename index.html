<head>

    <meta property="og:title" content="Samuray43k | Imperial Angel">
    <meta property="og:description" content="天使様 — Mahiru Shiina Fan Page. Ad Gloriam Aeternam.">
    <meta property="og:image" content="avatar.jpg">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#C9A84C">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Raleway:wght@300;400;500;600;700&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #08060E;
            --surface: rgba(18, 15, 28, 0.75);
            --gold: #C9A84C;
            --gold-light: #E8D48B;
            --gold-dim: rgba(201, 168, 76, 0.15);
            --imperial-red: #8B1A1A;
            --imperial-green: #2A4A3A;
            --cream: #F0E6D3;
            --text-main: #E0D8CA;
            --text-dim: rgba(224, 216, 202, 0.5);

            --font-display: 'Playfair Display', serif;
            --font-body: 'Raleway', sans-serif;
            --font-jp: 'Zen Maru Gothic', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            background: var(--bg-dark);
            /* Фоллбэк если видео не загрузится */
            background-image:
                radial-gradient(ellipse at 30% 20%, rgba(201, 168, 76, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(139, 26, 26, 0.06) 0%, transparent 50%);
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* === VIDEO BG === */
        .bg-video {
            position: fixed; inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -5;
            opacity: 0.2;
            filter: saturate(0.4) brightness(0.6);
        }

        .bg-overlay {
            position: fixed; inset: 0;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(201, 168, 76, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(139, 26, 26, 0.05) 0%, transparent 50%),
                linear-gradient(180deg, rgba(8, 6, 14, 0.7) 0%, rgba(8, 6, 14, 0.95) 100%);
            z-index: -4;
        }

        /* === ORNAMENT SVG CORNERS === */
        .corner-ornament {
            position: fixed;
            width: 180px;
            height: 180px;
            z-index: 0;
            opacity: 0.12;
            pointer-events: none;
        }
        .corner-ornament svg { width: 100%; height: 100%; }
        .corner-tl { top: 20px; left: 20px; }
        .corner-tr { top: 20px; right: 20px; transform: scaleX(-1); }
        .corner-bl { bottom: 20px; left: 20px; transform: scaleY(-1); }
        .corner-br { bottom: 20px; right: 20px; transform: scale(-1, -1); }

        /* === GOLD PARTICLES (Canvas) === */
        .particles-canvas {
            position: fixed; inset: 0;
            pointer-events: none;
            z-index: 1;
            width: 100%;
            height: 100%;
        }

        /* === MAIN LAYOUT === */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 700px;
            z-index: 10;
            position: relative;
            padding: 3rem 0;
        }

        /* === IMPERIAL CREST === */
        .crest {
            width: 60px;
            height: 60px;
            margin-bottom: 1.5rem;
            opacity: 0;
            animation: fadeDown 1s ease 0.2s forwards;
        }
        .crest svg {
            width: 100%; height: 100%;
            filter: drop-shadow(0 0 12px rgba(201, 168, 76, 0.3));
        }

        /* === AVATAR === */
        .avatar-wrapper {
            position: relative;
            margin-bottom: 2.5rem;
            opacity: 0;
            animation: scaleIn 1.2s cubic-bezier(0.2, 1, 0.3, 1) 0.3s forwards;
        }

        .avatar-border {
            width: 220px;
            height: 220px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* SVG-кольцо вместо conic-gradient + rotate (GPU-friendly) */
        .avatar-ring {
            position: absolute;
            inset: -4px;
            width: calc(100% + 8px);
            height: calc(100% + 8px);
            animation: rotateBorder 12s linear infinite;
            will-change: transform;
        }

        .avatar-ring-track {
            fill: none;
            stroke: var(--gold-dim);
            stroke-width: 2;
        }

        .avatar-ring-main {
            fill: none;
            stroke: url(#goldGradient);
            stroke-width: 3;
            stroke-linecap: round;
        }

        .avatar-outer-ring {
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            border: 1px solid var(--gold-dim);
            pointer-events: none;
        }

        .avatar-outer-ring-2 {
            position: absolute;
            inset: -20px;
            border-radius: 50%;
            border: 1px solid rgba(201, 168, 76, 0.06);
            pointer-events: none;
        }

        .avatar-inner {
            width: 212px;
            height: 212px;
            border-radius: 50%;
            overflow: hidden;
            background: var(--bg-dark);
            position: relative;
            z-index: 1;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease, filter 0.4s ease;
            filter: saturate(0.9) contrast(1.05);
        }

        .avatar-wrapper:hover .avatar-img {
            transform: scale(1.1);
            filter: saturate(1.1) contrast(1.1);
        }

        .avatar-glow {
            position: absolute;
            inset: -40px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(201, 168, 76, 0.1) 0%, transparent 70%);
            z-index: -1;
            animation: pulseGlow 4s ease-in-out infinite alternate;
            will-change: transform, opacity;
        }

        /* === NAME === */
        .name-section {
            text-align: center;
            margin-bottom: 1rem;
        }

        .jp-title {
            font-family: var(--font-jp);
            color: var(--gold);
            font-size: 0.85rem;
            letter-spacing: 0.5em;
            margin-bottom: 0.8rem;
            opacity: 0;
            animation: fadeDown 0.8s ease 0.6s forwards;
        }

        h1 {
            font-family: var(--font-display);
            font-size: clamp(2.8rem, 7vw, 4.5rem);
            font-weight: 900;
            color: var(--cream);
            line-height: 1;
            letter-spacing: 0.04em;
            position: relative;
            display: inline-block;
            /* 3D perspective для charReveal rotateX */
            perspective: 600px;
        }

        .char {
            display: inline-block;
            opacity: 0;
            transform: translateY(40px) rotateX(-40deg);
            animation: charReveal 0.9s cubic-bezier(0.2, 1, 0.3, 1) forwards;
        }

        .title-ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
            opacity: 0;
            animation: fadeIn 1s ease 1.2s forwards;
        }

        .ornament-line {
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .ornament-diamond {
            width: 8px;
            height: 8px;
            background: var(--gold);
            transform: rotate(45deg);
            flex-shrink: 0;
        }

        /* === QUOTE === */
        .quote-section {
            text-align: center;
            margin: 2rem 0 2.5rem;
            max-width: 500px;
            opacity: 0;
            animation: fadeIn 1s ease 1s forwards;
        }

        .quote-text {
            font-family: var(--font-display);
            font-style: italic;
            font-size: 1.15rem;
            color: var(--text-main);
            line-height: 1.6;
            margin-bottom: 0.6rem;
        }

        .quote-text::before { content: '\201E'; color: var(--gold); font-size: 1.5rem; }
        .quote-text::after { content: '\201C'; color: var(--gold); font-size: 1.5rem; }

        .quote-jp {
            font-family: var(--font-jp);
            font-size: 0.8rem;
            color: var(--gold);
            opacity: 0.6;
            letter-spacing: 0.08em;
        }

        /* === LINKS === */
        .links {
            display: flex;
            gap: 1.2rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 2.5rem;
            opacity: 0;
            animation: fadeIn 1s ease 1.3s forwards;
        }

        .btn {
            text-decoration: none;
            color: var(--gold);
            font-family: var(--font-body);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            padding: 0.9rem 2.2rem;
            border: 1px solid rgba(201, 168, 76, 0.35);
            border-radius: 0;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            background: transparent;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--gold);
            transform: scaleY(0);
            transform-origin: bottom;
            transition: transform 0.4s cubic-bezier(0.2, 1, 0.3, 1);
            z-index: -1;
        }

        .btn:hover {
            color: var(--bg-dark);
            border-color: var(--gold);
            box-shadow: 0 0 30px rgba(201, 168, 76, 0.2);
        }

        .btn:hover::before {
            transform: scaleY(1);
        }

        /* === IMPERIAL BANNER === */
        .imperial-banner {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 1.2rem 2rem;
            background: linear-gradient(90deg, transparent, rgba(201, 168, 76, 0.05), transparent);
            border-top: 1px solid rgba(201, 168, 76, 0.1);
            border-bottom: 1px solid rgba(201, 168, 76, 0.1);
            margin-bottom: 2rem;
            opacity: 0;
            animation: fadeIn 1s ease 1.5s forwards;
        }

        .banner-icon {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
        }
        .banner-icon svg {
            width: 100%; height: 100%;
        }

        .banner-text {
            font-family: var(--font-display);
            font-size: 0.85rem;
            color: var(--text-dim);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .banner-text span {
            color: var(--gold);
            font-weight: 700;
        }

        /* === FOOTER === */
        .footer {
            text-align: center;
            opacity: 0;
            animation: fadeIn 1s ease 1.8s forwards;
        }

        .footer-text {
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        /* === DECORATIVE BG TEXT === */
        .bg-deco-text {
            position: fixed;
            font-family: var(--font-jp);
            font-size: 25rem;
            font-weight: 900;
            color: rgba(201, 168, 76, 0.02);
            z-index: -1;
            pointer-events: none;
            user-select: none;
            writing-mode: vertical-rl;
            top: 50%;
            right: -5%;
            transform: translateY(-50%);
            animation: floatText 10s ease-in-out infinite alternate;
            will-change: transform;
        }

        /* === ANIMATIONS === */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes charReveal {
            to { opacity: 1; transform: translateY(0) rotateX(0deg); }
        }

        @keyframes rotateBorder {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulseGlow {
            from { opacity: 0.5; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1.05); }
        }

        @keyframes floatText {
            from { transform: translateY(-50%); }
            to { transform: translateY(calc(-50% - 30px)); }
        }

        /* === REDUCED MOTION === */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .particles-canvas { display: none; }
            .bg-deco-text { animation: none; transform: translateY(-50%); }
            .avatar-ring { animation: none; }
            .avatar-glow { animation: none; opacity: 0.7; }
            .char { opacity: 1; transform: none; }
            /* Убираем задержки — всё видно сразу */
            .crest, .jp-title, .title-ornament, .quote-section,
            .links, .imperial-banner, .footer, .avatar-wrapper {
                opacity: 1;
                transform: none;
            }
        }

        /* === RESPONSIVE === */
        @media (max-width: 768px) {
            .corner-ornament { width: 100px; height: 100px; }

            .avatar-border { width: 180px; height: 180px; }
            .avatar-inner { width: 172px; height: 172px; }

            h1 { font-size: clamp(2.2rem, 10vw, 3.2rem); }

            .quote-text { font-size: 1rem; }

            .imperial-banner {
                flex-direction: column;
                text-align: center;
                gap: 0.8rem;
                padding: 1rem;
            }

            .bg-deco-text { font-size: 15rem; right: -15%; }

            .links { flex-direction: column; width: 100%; max-width: 280px; }
            .btn { width: 100%; text-align: center; }
        }

        @media (max-width: 480px) {
            main { padding: 2rem 0; }
            .corner-ornament { width: 70px; height: 70px; opacity: 0.08; }
            .avatar-border { width: 150px; height: 150px; }
            .avatar-inner { width: 142px; height: 142px; }
            .ornament-line { width: 50px; }
            .bg-deco-text { font-size: 10rem; }
            .crest { width: 45px; height: 45px; }
        }
    </style>
</head>
<body>

    <script>
        // === Animated title ===
        const title = document.getElementById('main-title');
        const text = title.textContent;
        title.textContent = '';

        // Проверяем prefers-reduced-motion
        const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (prefersReduced) {
            title.textContent = text;
        } else {
            [...text].forEach((char, i) => {
                const span = document.createElement('span');
                span.textContent = char;
                span.className = 'char';
                span.style.animationDelay = `${i * 0.07 + 0.7}s`;
                title.appendChild(span);
            });
        }

        // === Canvas Gold Particles ===
        // Один canvas вместо 30 DOM-элементов с box-shadow = ~3x меньше нагрузки
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');

        let particles = [];
        let animId;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function createParticles(count) {
            particles = [];
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 3 + 1.5,
                    speed: Math.random() * 0.6 + 0.2,
                    rotation: Math.random() * 360,
                    rotSpeed: (Math.random() - 0.5) * 0.8,
                    phase: Math.random() * Math.PI * 2,
                    drift: Math.random() * 0.3 + 0.1
                });
            }
        }

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (const p of particles) {
                // Движение вверх
                p.y -= p.speed;
                p.rotation += p.rotSpeed;
                p.x += Math.sin(p.phase + p.y * 0.005) * p.drift;

                // Ресет за верхний край
                if (p.y < -20) {
                    p.y = canvas.height + 20;
                    p.x = Math.random() * canvas.width;
                }

                // Opacity на основе позиции (fade in/out у краёв)
                const normalY = p.y / canvas.height;
                let alpha = 0.6;
                if (normalY > 0.85) alpha = (1 - normalY) / 0.15 * 0.6;
                else if (normalY < 0.1) alpha = normalY / 0.1 * 0.6;

                // Glow
                ctx.save();
                ctx.globalAlpha = alpha * 0.3;
                ctx.fillStyle = '#C9A84C';
                ctx.shadowBlur = 8;
                ctx.shadowColor = 'rgba(201, 168, 76, 0.5)';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * 2, 0, Math.PI * 2);
                ctx.fill();

                // Core
                ctx.globalAlpha = alpha;
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            animId = requestAnimationFrame(drawParticles);
        }

        if (!prefersReduced) {
            createParticles(30);
            drawParticles();
        }

        // Пауза анимации когда вкладка неактивна (экономия батареи)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                cancelAnimationFrame(animId);
            } else if (!prefersReduced) {
                drawParticles();
            }
        });
    </script>
</body>
</html>
