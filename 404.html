<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — такой сцены нет</title>
  <meta name="description" content="Такой страницы на samuray4ik04.github.io нет.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#EEF3F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#08110E" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;700&family=Prata&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: light dark;

      --paper:   #EEF3F0;
      --panel:   #FBFDFC;
      --ink:     #101B17;
      --mute:    #566B63;
      --mint:    #7FDCBB;
      --pine:    #23443A;
      --ice-ink: #1B6E9F;
      --line:    color-mix(in srgb, var(--ink) 12%, transparent);
      --tag-bg:  #23443A;
      --tag-fg:  #EAF6F0;

      --display: "Prata", Georgia, serif;
      --sans:    "Manrope", "Segoe UI", system-ui, sans-serif;
      --mono:    "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --ease: cubic-bezier(.2, .8, .2, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper:   #08110E;
        --panel:   #0F1B17;
        --ink:     #E8F2ED;
        --mute:    #94AAA2;
        --mint:    #8FE3C4;
        --pine:    #A8CFC0;
        --ice-ink: #79C2F0;
        --line:    color-mix(in srgb, var(--ink) 15%, transparent);
        --tag-bg:  #8FE3C4;
        --tag-fg:  #08110E;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(20px, 5vw, 56px);
      background:
        radial-gradient(680px 520px at 82% -8%, color-mix(in srgb, var(--mint) 40%, transparent), transparent 68%),
        var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    ::selection { background: var(--mint); color: var(--pine); }
    :focus-visible { outline: 3px solid var(--ice-ink); outline-offset: 3px; border-radius: 4px; }

    .box {
      position: relative;
      width: min(540px, 100%);
      padding: clamp(30px, 5vw, 40px) clamp(22px, 4vw, 34px) clamp(24px, 3vw, 30px);
      border: 1px solid var(--line);
      border-radius: 26px;
      background: var(--panel);
      box-shadow: 0 40px 70px -52px color-mix(in srgb, var(--pine) 70%, transparent);
      animation: rise .7s var(--ease) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: none; }
    }

    .who {
      position: absolute; top: -13px; left: clamp(18px, 3vw, 28px);
      display: inline-flex; align-items: center; gap: 7px;
      padding: 5px 13px 6px;
      border-radius: 999px;
      background: var(--tag-bg);
      color: var(--tag-fg);
      font-family: var(--mono);
      font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    }
    .who svg { width: 9px; height: 9px; fill: currentColor; }

    .code {
      display: inline-block;
      font-family: var(--display);
      font-size: clamp(64px, 18vw, 112px);
      line-height: .9;
      letter-spacing: -.03em;
      color: var(--ice-ink);
      background: linear-gradient(var(--mint), var(--mint)) 0 .68em / 100% .11em no-repeat;
    }

    h1 {
      margin-top: 20px;
      font-family: var(--display);
      font-weight: 400;
      font-size: clamp(24px, 4.4vw, 32px);
      line-height: 1.3;
      letter-spacing: -.01em;
    }

    .note {
      margin-top: 12px;
      max-width: 38ch;
      font-size: 15px;
      color: var(--mute);
      text-wrap: pretty;
    }

    .back {
      display: inline-flex; align-items: center; gap: 9px;
      margin-top: 26px;
      padding: 12px 20px 13px;
      border-radius: 999px;
      background: var(--mint);
      color: var(--pine);
      font-family: var(--mono);
      font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
      transition: translate .16s var(--ease), box-shadow .16s var(--ease);
    }
    .back:hover { translate: 0 -2px; box-shadow: 0 12px 26px -12px color-mix(in srgb, var(--pine) 70%, transparent); }
    .back:active { translate: 0 1px; box-shadow: none; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="box">
    <span class="who">
      <svg viewBox="0 0 10 10" aria-hidden="true"><rect width="4" height="10" rx="1"/></svg>
      samuray43k
    </span>
    <p class="code" aria-hidden="true">404</p>
    <h1>такой сцены нет</h1>
    <p class="note">Ссылка ведёт в пустоту: либо в адресе опечатка, либо страницу уже вырезали.</p>
    <a class="back" href="/"><span aria-hidden="true">◂</span> Вернуться на первую</a>
  </main>
</body>
</html>
