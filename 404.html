<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — лист не отпечатался</title>
  <meta name="description" content="Такой страницы на samuray4ik04.github.io нет.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#DCD8CB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Oswald:wght@500;700&family=PT+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: light dark;
      --news:    #DCD8CB;
      --soot:    #14110E;
      --soot-2:  #4A443C;
      --riot:    #E8443A;
      --riot-ink:#A81219;
      --on-riot: #14110E;
      --stencil: "Oswald", "Haettenschweiler", "Arial Narrow", sans-serif;
      --type:    "PT Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --marker:  "Caveat", "Bradley Hand", cursive;
      --ease: cubic-bezier(.2, .8, .2, 1);
    }
    @media (prefers-color-scheme: dark) {
      :root { --news:#121110; --soot:#E8E4D8; --soot-2:#9C968A; --riot-ink:#FF5C4E; --on-riot:#121110; }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100svh;
      display: grid; place-items: center;
      padding: 32px clamp(20px, 5.5vw, 48px);
      background: var(--news);
      color: var(--soot);
      font-family: var(--type);
      font-size: 15px; line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .dirt {
      position: fixed; inset: -20%;
      pointer-events: none; z-index: 9;
      opacity: .3; mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4'/></filter><rect width='220' height='220' filter='url(%23n)' opacity='.55'/></svg>");
    }
    @media (prefers-color-scheme: dark) { .dirt { mix-blend-mode: screen; opacity: .15; } }

    .sheet { position: relative; z-index: 1; width: 100%; max-width: 560px; }

    .kicker {
      font-size: 11px; letter-spacing: .2em; text-transform: uppercase;
      color: var(--soot-2);
      padding-bottom: 12px; margin-bottom: clamp(20px, 6vw, 34px);
      border-bottom: 2px solid var(--soot);
    }
    .kicker::before { content: "▮ "; color: var(--riot-ink); }

    .code {
      font-family: var(--stencil); font-weight: 700;
      font-size: clamp(96px, 34vw, 210px);
      line-height: .78; letter-spacing: -.03em;
      color: var(--riot-ink);
      translate: -.06em 0;
    }

    h1 {
      display: inline-block;
      margin: 18px 0 20px;
      padding: 6px 15px 8px;
      background: var(--riot); color: var(--on-riot);
      font-family: var(--stencil); font-weight: 500;
      font-size: clamp(17px, 4.2vw, 24px);
      letter-spacing: .1em; text-transform: uppercase;
      rotate: -1.2deg;
    }

    .note { max-width: 44ch; color: var(--soot-2); }

    .back {
      display: inline-flex; align-items: center; gap: 10px;
      margin-top: 30px;
      padding: 13px 20px 14px;
      border: 2px solid var(--soot);
      box-shadow: 5px 5px 0 var(--soot);
      font-family: var(--stencil); font-weight: 700;
      font-size: 17px; letter-spacing: .06em; text-transform: uppercase;
      color: inherit; text-decoration: none;
      rotate: -.4deg;
      transition: translate .16s var(--ease), rotate .16s var(--ease), background-color .16s, box-shadow .16s var(--ease);
    }
    .back:hover, .back:focus-visible {
      background: var(--riot); color: var(--on-riot);
      rotate: 0deg; translate: -3px -3px;
      box-shadow: 9px 9px 0 var(--soot);
    }
    .back:active { rotate: 0deg; translate: 3px 3px; box-shadow: 1px 1px 0 var(--soot); }
    :focus-visible { outline: 3px solid var(--riot-ink); outline-offset: 3px; }

    .scrawl {
      display: block; margin-top: 26px;
      font-family: var(--marker); font-weight: 700;
      font-size: clamp(20px, 5vw, 26px);
      color: var(--riot-ink);
      rotate: -2.5deg;
    }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="dirt" aria-hidden="true"></div>

  <div class="sheet">
    <p class="kicker">самиздат № 43 · брак тиража</p>
    <p class="code" aria-hidden="true">404</p>
    <h1>лист не отпечатался</h1>
    <p class="note">Такой страницы здесь нет: либо её съел ксерокс, либо ссылка была с опечаткой.</p>
    <a class="back" href="/">← на первую полосу</a>
    <span class="scrawl">всё остальное на месте</span>
  </div>
</body>
</html>
