<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Samuray43k — social preview</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Manrope:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 75% 30%, #ecdfbb, transparent 45%), #f6f5ed;
        color: #263f37;
        font-family: Manrope, sans-serif;
        padding: 60px 70px;
      }
      .label {
        font-size: 13px;
        letter-spacing: 3px;
      }
      .label:before {
        content: "✦";
        margin-right: 12px;
        color: #547861;
      }
      h1 {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-weight: 500;
        letter-spacing: -7px;
        font-size: 132px;
        line-height: 0.8;
        margin: 54px 0 30px;
      }
      h1 span {
        display: block;
        color: #315b49;
        font-style: italic;
        margin-top: 8px;
      }
      .role {
        font-size: 19px;
      }
      .footer {
        position: absolute;
        bottom: 44px;
        font-size: 13px;
        color: #626d62;
      }
      .card {
        position: absolute;
        top: 78px;
        left: 641px;
        width: 245px;
        border: 8px solid #fffaf0;
        background: #fffaf0;
        border-radius: 130px 130px 14px 14px;
        transform: rotate(-9deg);
        box-shadow: 0 18px 36px #263f3720;
      }
      .window {
        position: relative;
        height: 355px;
        background: #ebd3a2;
        border-radius: 120px 120px 5px 5px;
        overflow: hidden;
      }
      .card img {
        position: absolute;
        height: 540px;
        left: 50%;
        transform: translateX(-50%);
        top: 0;
      }
      .caption {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: 27px;
        padding: 12px 8px 8px;
      }
      .second {
        left: 891px;
        top: 133px;
        transform: rotate(9deg);
        background: #f1f8ee;
        border-color: #f1f8ee;
      }
      .second .window {
        background: #b4d9bb;
      }
      .second img {
        height: 450px;
        top: -25px;
      }
      .star {
        position: absolute;
        left: 1090px;
        top: 40px;
        font-size: 50px;
        color: #315b49;
      }
      .note {
        position: absolute;
        top: 540px;
        left: 615px;
        transform: rotate(-5deg);
        background: #fffaf0;
        color: #5b6952;
        padding: 12px 25px;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: 26px;
        font-style: italic;
        box-shadow: 0 4px 15px #263f3712;
      }
    </style>
  </head>
  <body>
    <div class="label">PERSONAL SPACE / 043</div>
    <h1>Samuray<span>43k ✳</span></h1>
    <p class="role">лютый вайбкодер · нежный вайб</p>
    <div class="card">
      <div class="window"><img src="../assets/mahiru.png" alt="" /></div>
      <div class="caption">Mahiru Shiina</div>
    </div>
    <div class="card second">
      <div class="window"><img src="../assets/huohuo.webp" alt="" /></div>
      <div class="caption">Huohuo</div>
    </div>
    <div class="star">✦</div>
    <div class="note">♡ два мира, один уют</div>
    <p class="footer">
      samuray4ik04.github.io &nbsp; ↗ &nbsp; Telegram · GitHub · TikTok
    </p>
  </body>
</html>
